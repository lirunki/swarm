[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-dashboard"
version = "0.1.0"
description = "A local, persistent dashboard for many coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "anyio>=3.6.2,<5",
    "uvicorn>=0.30,<1",
    "websockets>=12,<18",
    "pydantic>=2.9,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.9"]

[project.scripts]
swarm = "swarm.entrypoint:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
swarm = ["static/*", "static/vendor/*", "skills/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
